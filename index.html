<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교실 알람</title>
<style>
  :root {
    --color-charcoal-ink: #303030;
    --color-paper-white: #ffffff;
    --color-concrete-gray: #dbdbdb;
    --color-fog-mist: #f2f2f2;
    --color-ash-border: #ededed;
    --color-smoke: #c2c2c2;
    --color-graphite: #808080;
    --color-pure-black: #000000;
    --color-sand-wash: #e2ceb8;
    --color-slate-veil: #6a728e;
    --color-highlight-yellow: #f9f5a2;
    --color-highlight-cyan: #c7f6ff;

    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;

    --radius-cards: 20px;
    --radius-badges: 20px;
    --radius-images: 10px;
    --radius-inputs: 25px;
    --radius-buttons: 20px;

    --shadow-sm: rgba(0, 0, 0, 0.16) 0px 3px 6px 0px;
    --shadow-sm-2: rgba(0, 0, 0, 0.18) 0px 1px 4px 0px;

    --overlay-clock-size: 64px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--color-concrete-gray);
    color: var(--color-charcoal-ink);
    font-family: var(--font-mono);
    font-feature-settings: "liga" 0, "calt" 0;
  }
  .page {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px;
  }
  .topbar {
    text-align: center;
    font-size: 14px;
    color: var(--color-charcoal-ink);
    margin-bottom: 24px;
  }
  .topbar .hl {
    background: var(--color-highlight-yellow);
    padding: 0 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
    align-items: start;
  }
  .card {
    background: var(--color-paper-white);
    border-radius: var(--radius-cards);
    padding: 22px;
    box-shadow: var(--shadow-sm);
  }
  .caption {
    text-align: center;
    font-size: 11px;
    color: var(--color-charcoal-ink);
    margin-bottom: 16px;
  }

  /* ---------- 시계 카드 ---------- */
  .clock-card { text-align: center; }
  .clock-time {
    font-size: 43px;
    font-weight: 400;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .clock-date {
    margin-top: 4px;
    color: var(--color-graphite);
    font-size: 14px;
  }

  /* ---------- 폼 ---------- */
  label.field { display: block; margin-bottom: 14px; }
  label.field span {
    display: block;
    font-size: 14px;
    color: var(--color-graphite);
    margin-bottom: 6px;
  }
  input[type="time"], input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 10px 16px;
    border-radius: var(--radius-inputs);
    border: none;
    background: var(--color-ash-border);
    color: var(--color-charcoal-ink);
    font-family: var(--font-mono);
    font-size: 16px;
  }
  input::placeholder { color: var(--color-smoke); }
  input[type="range"] {
    width: 100%;
    accent-color: var(--color-charcoal-ink);
  }
  .day-toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .day-btn {
    flex: 1;
    min-width: 36px;
    padding: 8px 0;
    border-radius: var(--radius-buttons);
    border: none;
    background: var(--color-fog-mist);
    color: var(--color-charcoal-ink);
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
  }
  .day-btn.active {
    background: var(--color-charcoal-ink);
    color: var(--color-paper-white);
  }
  .row { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 8px 24px;
    border-radius: var(--radius-buttons);
    border: none;
    background: var(--color-fog-mist);
    color: var(--color-charcoal-ink);
    font-family: var(--font-mono);
    font-size: 14px;
    cursor: pointer;
  }
  .btn-solid {
    background: var(--color-paper-white);
    box-shadow: var(--shadow-sm-2);
    text-transform: uppercase;
  }
  .hint {
    margin-top: 10px;
    font-size: 11px;
    color: var(--color-graphite);
  }

  /* ---------- 목록 ---------- */
  .alarm-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 2px;
    border-bottom: 1px solid var(--color-ash-border);
    gap: 10px;
  }
  .alarm-item:last-child { border-bottom: none; }
  .alarm-item.off .alarm-time,
  .alarm-item.off .alarm-msg { color: var(--color-smoke); }
  .alarm-time {
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }
  .alarm-msg {
    font-size: 13px;
    color: var(--color-graphite);
    margin-top: 2px;
    word-break: break-all;
  }
  .alarm-repeat {
    font-size: 12px;
    color: var(--color-slate-veil);
    margin-top: 2px;
  }
  .alarm-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--color-smoke); border-radius: 999px; transition: .2s;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px;
    left: 3px; bottom: 3px; background: var(--color-paper-white); border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--color-charcoal-ink); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .del-btn {
    border: none; background: none; color: var(--color-graphite);
    font-family: var(--font-mono);
    font-size: 13px; cursor: pointer; padding: 4px 6px;
  }
  .empty {
    text-align: center;
    color: var(--color-graphite);
    font-size: 14px;
    padding: 30px 0;
  }

  /* ---------- 알람 발동 오버레이 ----------
     position:fixed로 항상 화면 전체를 덮는다 (requestFullscreen 거부 대비 기본 수단).
     교실에서 학생들이 즉시 알아챌 수 있도록 시계를 확대 + 강조색으로 펄스시킨다. */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--color-sand-wash);
    color: var(--color-charcoal-ink);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: var(--font-mono);
  }
  #overlay.show { display: flex; }
  .overlay-time {
    font-size: var(--overlay-clock-size);
    font-variant-numeric: tabular-nums;
    background: var(--color-highlight-yellow);
    padding: 8px 28px;
    border-radius: var(--radius-cards);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .overlay-msg {
    margin-top: 28px;
    font-size: 25px;
    max-width: 480px;
    word-break: break-all;
    background: var(--color-highlight-cyan);
    padding: 14px 22px;
    border-radius: var(--radius-cards);
  }
  .overlay-speaking {
    margin-top: 14px;
    font-size: 12px;
    color: var(--color-charcoal-ink);
  }
  .overlay-actions { margin-top: 40px; display: flex; gap: 14px; }
  .overlay-actions button {
    padding: 14px 28px;
    border-radius: var(--radius-buttons);
    border: none;
    font-family: var(--font-mono);
    font-size: 15px;
    cursor: pointer;
  }
  #snoozeBtn { background: var(--color-fog-mist); color: var(--color-charcoal-ink); }
  #dismissBtn { background: var(--color-paper-white); color: var(--color-charcoal-ink); box-shadow: var(--shadow-sm-2); }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">classroom (a)<span class="hl">l</span>arm.</div>

  <div class="grid">

    <div class="card clock-card">
      <div class="caption">(Y)our class clock.</div>
      <div class="clock-time" id="clockTime">00:00:00</div>
      <div class="clock-date" id="clockDate">----.--.--</div>
    </div>

    <div class="card">
      <div class="caption">(Y)our new alarm.</div>
      <form id="alarmForm">
        <label class="field">
          <span>시간</span>
          <input type="time" step="1" id="timeInput" required>
        </label>
        <label class="field">
          <span>읽어줄 메시지 (최대 60자)</span>
          <input type="text" id="msgInput" maxlength="60" placeholder="예: 자리에 앉아 수업 준비를 하세요!">
        </label>
        <label class="field">
          <span>반복 요일 (미선택 시 1회용)</span>
          <div class="day-toggles" id="dayToggles">
            <button type="button" class="day-btn" data-day="0">일</button>
            <button type="button" class="day-btn" data-day="1">월</button>
            <button type="button" class="day-btn" data-day="2">화</button>
            <button type="button" class="day-btn" data-day="3">수</button>
            <button type="button" class="day-btn" data-day="4">목</button>
            <button type="button" class="day-btn" data-day="5">금</button>
            <button type="button" class="day-btn" data-day="6">토</button>
          </div>
        </label>
        <div class="row">
          <button type="button" class="btn" id="previewBtn">미리듣기</button>
          <button type="submit" class="btn btn-solid">알람 추가</button>
        </div>
        <p class="hint">알람음 대신, 입력한 메시지를 음성으로 읽어줍니다.</p>
      </form>
    </div>

    <div class="card">
      <div class="caption">(Y)our settings.</div>

      <label class="field">
        <span>알람 화면 시계 크기 (<span id="clockSizeValue">64</span>px)</span>
        <input type="range" id="clockSizeInput" min="40" max="140" step="4" value="64">
      </label>

      <label class="field">
        <span>메시지 반복 횟수 (0 = 끄기 전까지 무한)</span>
        <input type="number" id="repeatCountInput" min="0" max="50" value="0">
      </label>

      <label class="field">
        <span>반복 간격 (초)</span>
        <input type="number" id="repeatIntervalInput" min="1" max="30" value="3">
      </label>

      <label class="field">
        <span>알람 표시 모니터</span>
        <div class="row" style="margin-bottom: 8px;">
          <button type="button" class="btn" id="detectScreensBtn">모니터 감지</button>
        </div>
        <select id="screenSelect" disabled>
          <option value="">현재 창과 같은 화면</option>
        </select>
        <p class="hint" id="screenHint">다중 모니터 선택은 Chrome/Edge에서만 지원됩니다. 먼저 '모니터 감지'를 눌러 권한을 허용하세요.</p>
      </label>
    </div>

    <div class="card">
      <div class="caption">(Y)our alarm list.</div>
      <div id="alarmList"></div>
    </div>

  </div>
</div>

<div id="overlay">
  <div class="overlay-time" id="overlayTime">00:00</div>
  <div class="overlay-msg" id="overlayMsg">알람</div>
  <div class="overlay-speaking" id="overlaySpeaking">🔊 음성 안내 중...</div>
  <div class="overlay-actions">
    <button id="snoozeBtn">5분 후</button>
    <button id="dismissBtn">끄기</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULT_MSG = "수업 준비할 시간입니다. 자리에 앉아주세요.";

  // ---------- 유틸 ----------
  function pad(n) { return String(n).padStart(2, "0"); }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function normalizeTime(t) {
    // <input type="time" step="1">은 보통 HH:MM:SS를 반환하지만,
    // 일부 브라우저/환경에서 HH:MM만 줄 수 있어 보정한다.
    if (!t) return "";
    return t.length === 5 ? t + ":00" : t;
  }

  function formatTime12(t) {
    var parts = t.split(":").map(Number);
    var h = parts[0], m = parts[1], s = parts[2] || 0;
    var period = h < 12 ? "오전" : "오후";
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return period + " " + pad(h12) + ":" + pad(m) + ":" + pad(s);
  }

  var DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

  function repeatLabel(days) {
    if (!days || days.length === 0) return "1회";
    return days.slice().sort(function (a, b) { return a - b; })
      .map(function (d) { return DAY_NAMES[d]; }).join(", ");
  }

  // ---------- localStorage: 알람 ----------
  var STORAGE_KEY = "alarms";

  function loadAlarms() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveAlarms() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
  }

  var alarms = loadAlarms();
  var firedKeys = new Set();

  // ---------- localStorage: 설정 ----------
  var SETTINGS_KEY = "alarmSettings";
  var DEFAULT_SETTINGS = {
    clockSize: 64,      // 발동 화면 시계 폰트 크기(px)
    repeatCount: 0,     // 메시지 반복 횟수, 0이면 끄기 전까지 무한
    repeatInterval: 3,  // 반복 간격(초)
    screen: null        // 선택된 모니터 스냅샷 { left, top, width, height, label }
  };

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return Object.assign({}, DEFAULT_SETTINGS, parsed);
    } catch (e) {
      return Object.assign({}, DEFAULT_SETTINGS);
    }
  }

  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  }

  var settings = loadSettings();

  // ---------- 음성 안내 (Web Speech API) ----------
  var speakLoopActive = false;
  var speakTimeout = null;

  function speakOnce(text, onend) {
    if (!("speechSynthesis" in window)) {
      if (onend) onend();
      return;
    }
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ko-KR";
    utter.rate = 0.95;
    utter.pitch = 1;
    if (onend) utter.onend = onend;
    window.speechSynthesis.speak(utter);
  }

  function startSpeakingLoop(text) {
    stopSpeakingLoop();
    speakLoopActive = true;
    var count = 0;
    var maxCount = settings.repeatCount || 0; // 0 = 무한
    var intervalMs = (settings.repeatInterval || 3) * 1000;
    function loop() {
      if (!speakLoopActive) return;
      count++;
      speakOnce(text, function () {
        if (!speakLoopActive) return;
        if (maxCount > 0 && count >= maxCount) {
          speakLoopActive = false; // 설정한 횟수만큼 다 읽으면 음성만 멈추고, 화면은 끄기 전까지 유지
          return;
        }
        speakTimeout = setTimeout(loop, intervalMs);
      });
    }
    loop();
  }

  function stopSpeakingLoop() {
    speakLoopActive = false;
    if (speakTimeout) {
      clearTimeout(speakTimeout);
      speakTimeout = null;
    }
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  }

  // ---------- DOM 참조 ----------
  var clockTime = document.getElementById("clockTime");
  var clockDate = document.getElementById("clockDate");
  var form = document.getElementById("alarmForm");
  var timeInput = document.getElementById("timeInput");
  var msgInput = document.getElementById("msgInput");
  var previewBtn = document.getElementById("previewBtn");
  var dayToggles = document.getElementById("dayToggles");
  var listEl = document.getElementById("alarmList");
  var overlay = document.getElementById("overlay");
  var overlayTime = document.getElementById("overlayTime");
  var overlayMsg = document.getElementById("overlayMsg");
  var snoozeBtn = document.getElementById("snoozeBtn");
  var dismissBtn = document.getElementById("dismissBtn");

  var clockSizeInput = document.getElementById("clockSizeInput");
  var clockSizeValue = document.getElementById("clockSizeValue");
  var repeatCountInput = document.getElementById("repeatCountInput");
  var repeatIntervalInput = document.getElementById("repeatIntervalInput");
  var detectScreensBtn = document.getElementById("detectScreensBtn");
  var screenSelect = document.getElementById("screenSelect");
  var screenHint = document.getElementById("screenHint");

  var selectedDays = new Set();

  Array.prototype.forEach.call(dayToggles.querySelectorAll(".day-btn"), function (btn) {
    btn.addEventListener("click", function () {
      var d = Number(btn.dataset.day);
      if (selectedDays.has(d)) {
        selectedDays.delete(d);
        btn.classList.remove("active");
      } else {
        selectedDays.add(d);
        btn.classList.add("active");
      }
    });
  });

  previewBtn.addEventListener("click", function () {
    speakOnce(msgInput.value.trim() || DEFAULT_MSG);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var time = normalizeTime(timeInput.value);
    if (!time) return;

    var days = Array.from(selectedDays).sort(function (a, b) { return a - b; });

    alarms.push({
      id: Date.now(),
      time: time,
      msg: msgInput.value.trim().slice(0, 60),
      days: days,
      on: true
    });

    saveAlarms();
    render();

    msgInput.value = "";
    selectedDays.clear();
    Array.prototype.forEach.call(dayToggles.querySelectorAll(".day-btn"), function (btn) {
      btn.classList.remove("active");
    });
  });

  listEl.addEventListener("change", function (e) {
    if (!e.target.classList.contains("toggle-on")) return;
    var id = Number(e.target.dataset.id);
    var alarm = alarms.find(function (a) { return a.id === id; });
    if (!alarm) return;
    alarm.on = e.target.checked;
    saveAlarms();
    render();
  });

  listEl.addEventListener("click", function (e) {
    if (!e.target.classList.contains("del-btn")) return;
    var id = Number(e.target.dataset.id);
    alarms = alarms.filter(function (a) { return a.id !== id; });
    saveAlarms();
    render();
  });

  function render() {
    alarms.sort(function (a, b) { return a.time.localeCompare(b.time); });

    if (alarms.length === 0) {
      listEl.innerHTML = '<p class="empty">등록된 알람이 없습니다</p>';
      return;
    }

    listEl.innerHTML = alarms.map(function (a) {
      return (
        '<div class="alarm-item' + (a.on ? "" : " off") + '">' +
          '<div class="alarm-info">' +
            '<div class="alarm-time">' + formatTime12(a.time) + "</div>" +
            '<div class="alarm-msg">' + escapeHtml(a.msg || DEFAULT_MSG) + "</div>" +
            '<div class="alarm-repeat">' + repeatLabel(a.days) + "</div>" +
          "</div>" +
          '<div class="alarm-actions">' +
            '<label class="switch">' +
              '<input type="checkbox" class="toggle-on" data-id="' + a.id + '" ' + (a.on ? "checked" : "") + ">" +
              '<span class="slider"></span>' +
            "</label>" +
            '<button class="del-btn" data-id="' + a.id + '">삭제</button>' +
          "</div>" +
        "</div>"
      );
    }).join("");
  }

  // ---------- 설정: 시계 크기 ----------
  function applyClockSize(px) {
    document.documentElement.style.setProperty("--overlay-clock-size", px + "px");
  }

  clockSizeInput.value = settings.clockSize;
  clockSizeValue.textContent = settings.clockSize;
  applyClockSize(settings.clockSize);

  clockSizeInput.addEventListener("input", function () {
    var v = Number(clockSizeInput.value);
    settings.clockSize = v;
    clockSizeValue.textContent = v;
    applyClockSize(v);
    saveSettings();
  });

  // ---------- 설정: 반복 횟수 / 간격 ----------
  repeatCountInput.value = settings.repeatCount;
  repeatIntervalInput.value = settings.repeatInterval;

  repeatCountInput.addEventListener("change", function () {
    settings.repeatCount = Math.max(0, Number(repeatCountInput.value) || 0);
    repeatCountInput.value = settings.repeatCount;
    saveSettings();
  });

  repeatIntervalInput.addEventListener("change", function () {
    settings.repeatInterval = Math.min(30, Math.max(1, Number(repeatIntervalInput.value) || 3));
    repeatIntervalInput.value = settings.repeatInterval;
    saveSettings();
  });

  // ---------- 설정: 모니터 선택 (Window Management API) ----------
  var detectedScreens = [];

  function populateScreenSelect() {
    screenSelect.disabled = detectedScreens.length === 0;
    var options = ['<option value="">현재 창과 같은 화면</option>'];
    detectedScreens.forEach(function (s, i) {
      var label = (s.label || ("모니터 " + (i + 1))) + (s.isPrimary ? " (주 모니터)" : "") + " · " + s.width + "x" + s.height;
      var isSelected = settings.screen && settings.screen.left === s.left && settings.screen.top === s.top;
      options.push('<option value="' + i + '"' + (isSelected ? " selected" : "") + ">" + escapeHtml(label) + "</option>");
    });
    screenSelect.innerHTML = options.join("");
  }

  if (settings.screen) {
    screenHint.textContent = "마지막으로 선택한 모니터: " + (settings.screen.label || "이름 없음") + " (재감지 시 다시 선택해주세요)";
  }

  detectScreensBtn.addEventListener("click", function () {
    if (!("getScreenDetails" in window)) {
      screenHint.textContent = "이 브라우저는 다중 모니터 감지를 지원하지 않습니다. (Chrome/Edge 최신 버전 권장)";
      return;
    }
    window.getScreenDetails().then(function (details) {
      detectedScreens = details.screens || [];
      populateScreenSelect();
      screenHint.textContent = detectedScreens.length + "개의 모니터를 찾았습니다. 알람을 표시할 모니터를 선택하세요.";
    }).catch(function () {
      screenHint.textContent = "모니터 정보 접근 권한이 거부되었습니다.";
    });
  });

  screenSelect.addEventListener("change", function () {
    var idx = screenSelect.value;
    if (idx === "") {
      settings.screen = null;
    } else {
      var s = detectedScreens[Number(idx)];
      settings.screen = {
        left: s.left,
        top: s.top,
        width: s.width,
        height: s.height,
        label: (s.label || ("모니터 " + (Number(idx) + 1))) + (s.isPrimary ? " (주 모니터)" : "")
      };
    }
    saveSettings();
  });

  // 저장된 모니터를 다시 찾아 ScreenDetailed 객체로 매칭한다 (좌표는 세션마다 동일하게 유지됨).
  function resolveTargetScreen() {
    if (!settings.screen || !("getScreenDetails" in window)) {
      return Promise.resolve(null);
    }
    return window.getScreenDetails().then(function (details) {
      var match = (details.screens || []).find(function (s) {
        return s.left === settings.screen.left && s.top === settings.screen.top;
      });
      return match || null;
    }).catch(function () {
      return null;
    });
  }

  // ---------- 시계 + 발동 검사 ----------
  function updateClock() {
    var now = new Date();
    clockTime.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    clockDate.textContent =
      now.getFullYear() + "." + pad(now.getMonth() + 1) + "." + pad(now.getDate()) +
      " (" + DAY_NAMES[now.getDay()] + ")";
  }

  function checkAlarms() {
    var now = new Date();
    var curTime = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    var curDay = now.getDay();
    var todayKey = now.toDateString();
    var changed = false;

    alarms.slice().forEach(function (alarm) {
      if (!alarm.on || alarm.time !== curTime) return;

      var isRepeat = alarm.days && alarm.days.length > 0;
      if (isRepeat && alarm.days.indexOf(curDay) === -1) return;

      // 같은 알람이 같은 날 같은 시각에 중복 발동되지 않도록 가드
      var fireKey = alarm.id + "_" + todayKey + "_" + curTime;
      if (firedKeys.has(fireKey)) return;
      firedKeys.add(fireKey);

      if (!isRepeat) {
        alarms = alarms.filter(function (a) { return a.id !== alarm.id; });
        changed = true;
      }

      triggerAlarm(alarm);
    });

    if (changed) {
      saveAlarms();
      render();
    }
  }

  // ---------- 알람 발동: 본창 오버레이 ----------
  var currentAlarm = null;
  var activePopup = null;

  function notify(alarm) {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    try {
      new Notification("⏰ 교실 알람", { body: alarm.msg || DEFAULT_MSG });
    } catch (e) {
      /* 일부 환경(예: 권한 정책 변경)에서 생성 실패 시 무시 */
    }
  }

  function showInPageOverlay(alarm, msg) {
    overlayTime.textContent = formatTime12(alarm.time);
    overlayMsg.textContent = msg;
    overlay.classList.add("show");

    // 전체화면 API는 사용자 제스처 없이 호출되면 거부될 수 있어 보조 수단으로만 시도한다.
    // 메인 알림 수단은 position:fixed 오버레이(이미 화면 전체를 덮음)이다.
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  }

  // 선택한 모니터 위치/크기에 맞춰 별도 팝업 창을 띄워 알람 화면을 표시한다.
  // (file:// 단일 파일 구조라 팝업 안에 동일한 마크업을 직접 작성하고,
  //  버튼 클릭은 window.opener를 통해 본창의 끄기/스누즈 로직을 그대로 재사용한다.)
  function openOverlayPopup(targetScreen, alarm, msg) {
    var features = "left=" + targetScreen.left + ",top=" + targetScreen.top +
      ",width=" + targetScreen.width + ",height=" + targetScreen.height;
    var win = window.open("", "classroomAlarmPopup", features);
    if (!win) {
      showInPageOverlay(alarm, msg);
      return;
    }
    activePopup = win;

    var html =
      '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><style>' +
      'html,body{margin:0;height:100%;background:#e2ceb8;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#303030;}' +
      '.t{font-size:' + settings.clockSize + 'px;background:#f9f5a2;padding:8px 28px;border-radius:20px;' +
      'animation:p 1.1s ease-in-out infinite;font-variant-numeric:tabular-nums;}' +
      '@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}' +
      '.m{margin-top:28px;font-size:25px;max-width:480px;word-break:break-all;background:#c7f6ff;' +
      'padding:14px 22px;border-radius:20px;text-align:center;}' +
      '.a{margin-top:40px;display:flex;gap:14px;}' +
      'button{padding:14px 28px;border-radius:20px;border:none;font-family:inherit;font-size:15px;cursor:pointer;}' +
      '#s{background:#f2f2f2;color:#303030;} #d{background:#fff;color:#303030;box-shadow:rgba(0,0,0,.18) 0 1px 4px;}' +
      '</style></head><body>' +
      '<div class="t">' + escapeHtml(formatTime12(alarm.time)) + '</div>' +
      '<div class="m">' + escapeHtml(msg) + '</div>' +
      '<div class="a"><button id="s">5분 후</button><button id="d">끄기</button></div>' +
      '<script>' +
      'document.getElementById("d").onclick=function(){ if(window.opener&&window.opener.__alarmDismiss) window.opener.__alarmDismiss(); window.close(); };' +
      'document.getElementById("s").onclick=function(){ if(window.opener&&window.opener.__alarmSnooze) window.opener.__alarmSnooze(); window.close(); };' +
      'if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); }' +
      '</' + 'script>' +
      '</body></html>';

    win.document.open();
    win.document.write(html);
    win.document.close();

    try {
      win.moveTo(targetScreen.left, targetScreen.top);
      win.resizeTo(targetScreen.width, targetScreen.height);
    } catch (e) {
      /* 일부 브라우저는 스크립트로 연 창 이동/크기조절을 제한할 수 있음 - 무시 */
    }
  }

  function triggerAlarm(alarm) {
    currentAlarm = alarm;
    var msg = alarm.msg || DEFAULT_MSG;

    notify(alarm);
    startSpeakingLoop(msg);

    resolveTargetScreen().then(function (targetScreen) {
      if (targetScreen) {
        openOverlayPopup(targetScreen, alarm, msg);
      } else {
        showInPageOverlay(alarm, msg);
      }
    });
  }

  function exitOverlay() {
    stopSpeakingLoop();
    overlay.classList.remove("show");
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function () {});
    }
    if (activePopup && !activePopup.closed) {
      activePopup.close();
    }
    activePopup = null;
  }

  function doSnooze() {
    var base = currentAlarm;
    exitOverlay();

    var t = new Date(Date.now() + 5 * 60 * 1000);
    var timeStr = pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds());

    alarms.push({
      id: Date.now(),
      time: timeStr,
      msg: (base && base.msg ? base.msg : DEFAULT_MSG) + " (스누즈)",
      days: [],
      on: true
    });

    saveAlarms();
    render();
    currentAlarm = null;
  }

  dismissBtn.addEventListener("click", function () {
    exitOverlay();
    currentAlarm = null;
  });

  snoozeBtn.addEventListener("click", doSnooze);

  // 모니터에 띄운 팝업 창의 버튼이 본창으로 호출하는 진입점
  window.__alarmDismiss = function () {
    exitOverlay();
    currentAlarm = null;
  };
  window.__alarmSnooze = doSnooze;

  // ---------- 초기화 ----------
  if (typeof Notification !== "undefined" && Notification.permission === "default") {
    Notification.requestPermission().catch(function () {});
  }

  updateClock();
  render();
  setInterval(function () {
    updateClock();
    checkAlarms();
  }, 1000);
})();
</script>
</body>
</html>
