<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Classroom Timer</title>
<style>
  :root {
    --bg: rgba(20, 20, 24, 0.55);
    --fg: #ffffff;
    --accent: #3ecf8e;
    --warn: #ffc94d;
    --danger: #ff5c5c;
    --control-bg: rgba(255, 255, 255, 0.12);
    --clock-fg: #ffffff;
    --clock-bg: transparent;
    --theme-bg: linear-gradient(145deg, rgba(30, 42, 62, 0.94), rgba(18, 24, 38, 0.94));
    --theme-card: rgba(255,255,255,0.12);
    --theme-ink: #ffffff;
    --theme-shadow: rgba(0,0,0,0.25);
    --theme-panel: rgba(28,28,32,0.97);
    --theme-panel-border: rgba(255,255,255,0.15);
    --theme-field: rgba(255,255,255,0.1);
    --theme-field-border: rgba(255,255,255,0.2);
    --theme-option: #202024;
    --theme-primary-ink: #08321f;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  #app {
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--clock-bg);   /* 기본은 투명 - 설정에서 반투명 색상으로 바꿀 수 있음 */
    border-radius: 14px;
    color: var(--fg);
    position: relative;
    isolation: isolate;
    overflow: hidden;
  }
  #app::before {
    content: '';
    position: absolute; inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: var(--theme-bg);
    opacity: 0.28;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.16);
    pointer-events: none;
  }

  /* 저학년용 화면 테마 */
  body[data-ui-theme="sunny"] {
    --fg: #29425f; --clock-fg: #26415f; --accent: #ff9f2f; --warn: #ee7b24;
    --danger: #ef5261; --control-bg: rgba(255,255,255,0.68);
    --theme-card: rgba(255,255,255,0.72); --theme-ink: #29425f;
    --theme-shadow: rgba(91,126,160,0.25);
    --theme-panel: rgba(255,250,221,0.98); --theme-panel-border: rgba(240,164,55,.48);
    --theme-field: rgba(255,255,255,.86); --theme-field-border: rgba(91,126,160,.3);
    --theme-option: #fff9dd; --theme-primary-ink: #513116;
    --theme-bg: radial-gradient(circle at 85% 12%, rgba(255,248,168,.82) 0 8%, transparent 9%), linear-gradient(145deg, rgba(201,242,255,.72), rgba(255,244,189,.72));
  }
  body[data-ui-theme="forest"] {
    --fg: #f8fff5; --clock-fg: #ffffff; --accent: #ffd55a; --warn: #ffd55a;
    --danger: #ff8b85; --control-bg: rgba(255,255,255,0.17);
    --theme-card: rgba(255,255,255,0.18); --theme-ink: #f8fff5;
    --theme-shadow: rgba(18,67,47,0.30);
    --theme-panel: rgba(25,92,70,.98); --theme-panel-border: rgba(224,255,204,.36);
    --theme-field: rgba(255,255,255,.14); --theme-field-border: rgba(255,255,255,.28);
    --theme-option: #185b47; --theme-primary-ink: #354009;
    --theme-bg: radial-gradient(circle at 10% 95%, rgba(139,209,124,.76) 0 15%, transparent 16%), linear-gradient(150deg, rgba(58,153,112,.72), rgba(23,98,79,.72));
  }
  body[data-ui-theme="space"] {
    --fg: #ffffff; --clock-fg: #fff7b2; --accent: #73e6ff; --warn: #ffd75e;
    --danger: #ff7895; --control-bg: rgba(255,255,255,0.13);
    --theme-card: rgba(120,116,255,0.20); --theme-ink: #ffffff;
    --theme-shadow: rgba(5,4,38,0.40);
    --theme-panel: rgba(29,27,82,.98); --theme-panel-border: rgba(150,184,255,.38);
    --theme-field: rgba(255,255,255,.12); --theme-field-border: rgba(157,194,255,.3);
    --theme-option: #25235e; --theme-primary-ink: #153b49;
    --theme-bg: radial-gradient(circle at 18% 20%, rgba(255,255,255,.9) 0 1px, transparent 2px), radial-gradient(circle at 82% 32%, rgba(255,245,162,.9) 0 2px, transparent 3px), linear-gradient(145deg, rgba(64,58,145,.76), rgba(21,24,73,.76));
    background-size: auto, auto, auto;
  }
  body:not([data-ui-theme="classic"]) #clockTime, body:not([data-ui-theme="classic"]) #timeText {
    -webkit-text-stroke: 1px rgba(0,0,0,.18);
    text-shadow: 0 2px 3px rgba(255,255,255,.28), 0 5px 14px rgba(0,0,0,.52);
  }
  body[data-ui-theme="sunny"] #clockTime,
  body[data-ui-theme="sunny"] #timeText {
    -webkit-text-stroke: 0;
    text-shadow: 0 3px 7px rgba(41,66,95,.22);
  }
  body:not([data-ui-theme="classic"]) .controls button,
  body:not([data-ui-theme="classic"]) .presets button,
  body:not([data-ui-theme="classic"]) .bottomnav button {
    border: 2px solid rgba(255,255,255,0.42);
    box-shadow: 0 3px 0 var(--theme-shadow);
    font-weight: 750;
  }
  body:not([data-ui-theme="classic"]) .controls button:active,
  body:not([data-ui-theme="classic"]) .presets button:active,
  body:not([data-ui-theme="classic"]) .bottomnav button:active { transform: translateY(2px); box-shadow: none; }
  body:not([data-ui-theme="classic"]) .controls button.primary { color: #173c42; }
  body[data-ui-theme="classic"] #app::before { opacity: 0; }
  body:not([data-ui-theme="classic"]) .titlebar .icon-btn {
    border: 1px solid rgba(255,255,255,.34);
    background: rgba(255,255,255,.12);
  }
  body:not([data-ui-theme="classic"]) .titlebar .icon-btn:hover { background: rgba(255,255,255,.3); }
  body:not([data-ui-theme="classic"]) .progress-wrap {
    background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.35);
    box-shadow: 0 2px 0 var(--theme-shadow);
  }

  /* 테마별 알람 발동 화면: 기본 UI의 사용자 지정 색상은 건드리지 않는다. */
  body[data-ui-theme="sunny"] #overlay {
    background: radial-gradient(circle at 84% 16%, #fff18b 0 9%, transparent 10%), linear-gradient(150deg,#69ccf2,#ffe590);
    color: #29425f;
  }
  body[data-ui-theme="forest"] #overlay {
    background: radial-gradient(circle at 12% 92%, #8ed478 0 17%, transparent 18%), linear-gradient(150deg,#55ae79,#135a47);
  }
  body[data-ui-theme="space"] #overlay {
    background: radial-gradient(circle at 18% 20%,#fff 0 2px,transparent 3px), radial-gradient(circle at 80% 25%,#ffe88a 0 3px,transparent 4px), linear-gradient(150deg,#554eb0,#12143e);
  }
  body:not([data-ui-theme="classic"]) #overlay {
    border-radius: 18px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.22);
  }
  body:not([data-ui-theme="classic"]) #overlayTime,
  body:not([data-ui-theme="classic"]) #overlayMsg {
    color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.12), 0 6px 16px rgba(0,0,0,.28);
  }
  body[data-ui-theme="sunny"] #overlayTime,
  body[data-ui-theme="sunny"] #overlayMsg { color:#29425f; text-shadow:0 2px 0 rgba(255,255,255,.65); }
  body:not([data-ui-theme="classic"]) .overlay-actions button {
    border: 2px solid rgba(255,255,255,.48); border-radius: 16px;
    box-shadow: 0 4px 0 var(--theme-shadow);
  }
  body:not([data-ui-theme="classic"]) #dismissBtn { background:var(--accent); color:var(--theme-primary-ink); }
  body:not([data-ui-theme="classic"]) #snoozeBtn,
  body:not([data-ui-theme="classic"]) #fullscreenBtn { background:rgba(255,255,255,.2) !important; color:#fff !important; }
  body[data-ui-theme="sunny"] #snoozeBtn,
  body[data-ui-theme="sunny"] #fullscreenBtn { color:#29425f !important; }
  body:not([data-ui-theme="classic"]) .corner-hint { opacity:.75; }
  body[data-ui-theme="sunny"] #clockDate,
  body[data-ui-theme="sunny"] #clockNextAlarm { text-shadow: 0 1px 3px #fff, 0 2px 7px rgba(0,0,0,.45); }

  .titlebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    -webkit-app-region: no-drag;   /* 드래그/더블클릭 최대화를 JS로 직접 처리(아래 스크립트) */
    flex-shrink: 0;
  }
  .titlebar-actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    -webkit-app-region: no-drag;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 34px;
    background: rgba(0,0,0,0.3);
    border: none;
    color: var(--fg);
    opacity: 0.85;
    font-size: 17px;
    cursor: pointer;
    width: 34px; height: 34px;
    padding: 0;
    border-radius: 6px;
    line-height: 1;
    vertical-align: middle;
    text-shadow: 0 1px 3px rgba(0,0,0,0.65);
  }
  .icon-btn:hover { opacity: 1; background: rgba(0,0,0,0.48); }
  .icon-btn.active { opacity: 1; background: rgba(62,207,142,0.35); }
  /* 이동 핸들: 클릭통과 모드에서도 창을 옮길 수 있는 위치를 항상 눈에 띄게 표시 */
  #dragHandle { cursor: move; }
  body[data-click-through="true"] #dragHandle {
    background: rgba(62,207,142,0.4);
    opacity: 1;
  }

  .view {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    /* 배경이 없는 평소 화면에서 뒤 창을 가리지 않도록 이 영역은 드래그/클릭을 받지 않음(맨 위 타이틀바만 조작 가능) */
    -webkit-app-region: no-drag;
    pointer-events: none;
    gap: clamp(2px, 1.5vh, 10px);
  }
  .view.active { display: flex; }
  .view .controls, .view .presets { pointer-events: auto; }   /* pointer-events는 상속되므로 버튼도 자동으로 클릭 가능 */

  /* ---------- 시계 뷰 ---------- */
  #clockTime {
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 42vh, 360px);
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--clock-fg);
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);   /* 어떤 배경 위에서도 잘 보이도록 */
  }
  #clockDate {
    font-size: clamp(13px, 4vh, 38px);
    opacity: 0.85;
    font-weight: 700;
    text-shadow: 0 1px 6px rgba(0,0,0,0.55);
  }
  #clockNextAlarm {
    font-size: clamp(10px, 2.6vh, 22px);
    opacity: 0.7;
    font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,0.55);
  }

  /* ---------- 타이머 뷰 ---------- */
  #timeText {
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: clamp(40px, 40vh, 320px);
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--clock-fg);
    transition: color 0.3s ease, transform 0.3s ease;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
  }
  #timeText.warn { color: var(--warn); }
  #timeText.danger { color: var(--danger); transform: scale(1.04); }

  .activity-label {
    max-width: 88%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: clamp(15px, 4.5vh, 34px);
    line-height: 1.15;
    font-weight: 800;
    color: var(--theme-ink);
    text-align: center;
    text-shadow: 0 1px 5px rgba(0,0,0,.2);
  }
  .timer-status {
    min-height: 1.4em;
    font-size: clamp(13px, 3.6vh, 26px);
    line-height: 1.2;
    font-weight: 800;
    color: var(--theme-ink);
    text-align: center;
  }
  .timer-status.warn { color: #94510d; }
  .timer-status.danger { color: #b51f33; }
  body[data-ui-theme="forest"] .timer-status.warn,
  body[data-ui-theme="space"] .timer-status.warn { color: var(--warn); }
  body[data-ui-theme="forest"] .timer-status.danger,
  body[data-ui-theme="space"] .timer-status.danger { color: var(--danger); }

  .progress-wrap {
    width: 80%;
    height: clamp(14px, 3.2vh, 24px);
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    overflow: hidden;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }
  #progressBar {
    height: 100%; width: 100%;
    background: var(--accent);
    transition: width 0.25s linear, background 0.3s ease;
  }
  #progressBar.warn { background: var(--warn); }
  #progressBar.danger { background: var(--danger); }

  .controls, .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }
  .controls { padding: 6px 10px 8px; }
  .presets { padding: 0 10px 4px; }
  .controls button, .presets button {
    -webkit-app-region: no-drag;
    background: var(--control-bg);
    color: var(--fg);
    border: none;
    min-height: 40px;
    border-radius: 11px;
    padding: 8px 14px;
    font-size: clamp(12px, 2.1vh, 16px);
    font-weight: 700;
    cursor: pointer;
  }
  .controls button:hover, .presets button:hover { background: rgba(255,255,255,0.25); }
  .controls button.primary { background: var(--accent); color: #08321f; font-weight: 700; }
  .controls button.primary { min-width: 112px; font-size: clamp(14px, 2.6vh, 19px); }
  .controls button.reset-armed { background: var(--danger); color: #fff; }

  .activity-editor {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: min(86%, 520px);
    pointer-events: auto;
  }
  .activity-editor label { font-size: 12px; font-weight: 800; white-space: nowrap; }
  #activityInput {
    min-width: 0;
    flex: 1;
    min-height: 38px;
    border: 2px solid var(--theme-field-border);
    border-radius: 10px;
    padding: 7px 10px;
    background: var(--theme-field);
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    user-select: text;
    outline: none;
  }
  #activityInput:focus { border-color: var(--accent); }

  /* 실행 중에는 학생이 볼 핵심 정보만 남기고 교사용 설정은 접는다. */
  body[data-timer-running="true"] .setup-only,
  body[data-timer-running="true"] .bottomnav,
  body[data-timer-running="true"] .titlebar { display: none; }
  body[data-timer-running="false"] #timeText { font-size: clamp(52px, min(30vh, 26vw), 170px); }
  body[data-timer-running="true"] #timerView { gap: clamp(7px, 2.2vh, 20px); }
  body[data-timer-running="true"] #timeText { font-size: clamp(54px, min(46vh, 30vw), 390px); }
  body[data-timer-running="true"] .focus-controls { padding-bottom: clamp(8px, 2vh, 18px); }
  body[data-timer-running="false"] .focus-only { display: none; }
  body[data-timer-running="false"] .activity-label { display: none; }

  /* ---------- 하단 네비 ---------- */
  .bottomnav {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 4px 8px 8px;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }
  .bottomnav button {
    -webkit-app-region: no-drag;
    background: var(--control-bg);
    color: var(--fg);
    border: none;
    border-radius: 8px;
    min-height: 38px;
    padding: 7px 18px;
    font-size: clamp(12px, 2vh, 15px);
    cursor: pointer;
    opacity: 0.7;
  }
  .bottomnav button.active { opacity: 1; background: rgba(62,207,142,0.35); font-weight: 700; }

  /* 모서리 크기조절 힌트: 배경이 투명해도 어디를 잡아야 크기를 조절할 수 있는지 보이도록 */
  .corner-hint {
    position: absolute;
    width: 16px; height: 16px;
    pointer-events: none;
    opacity: 0.55;
  }
  .corner-hint.tl { top: 2px; left: 2px; border-top: 3px solid rgba(255,255,255,0.55); border-left: 3px solid rgba(255,255,255,0.55); border-top-left-radius: 8px; }
  .corner-hint.tr { top: 2px; right: 2px; border-top: 3px solid rgba(255,255,255,0.55); border-right: 3px solid rgba(255,255,255,0.55); border-top-right-radius: 8px; }
  .corner-hint.bl { bottom: 2px; left: 2px; border-bottom: 3px solid rgba(255,255,255,0.55); border-left: 3px solid rgba(255,255,255,0.55); border-bottom-left-radius: 8px; }
  .corner-hint.br { bottom: 2px; right: 2px; border-bottom: 3px solid rgba(255,255,255,0.55); border-right: 3px solid rgba(255,255,255,0.55); border-bottom-right-radius: 8px; }

  /* ---------- 알람 발동 오버레이 ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 3vh, 28px);
    background: linear-gradient(160deg, rgba(62,207,142,0.96), rgba(20,120,90,0.97));
    border-radius: 14px;
    z-index: 100;
    -webkit-app-region: drag;
    text-align: center;
    padding: 20px;
    --ov-scale: 1;
  }
  #overlay[data-color="green"]  { background: linear-gradient(160deg, #3ecf8e, #14785a); }
  #overlay[data-color="blue"]   { background: linear-gradient(160deg, #4696ff, #1446a0); }
  #overlay[data-color="orange"] { background: linear-gradient(160deg, #ffa03c, #be5a0a); }
  #overlay[data-color="pink"]   { background: linear-gradient(160deg, #ff78b4, #be286e); }
  #overlay[data-color="red"]    { background: linear-gradient(160deg, #ff5a5a, #aa1414); }
  #overlay[data-color="dark"]   { background: linear-gradient(160deg, #2d2d37, #0f0f14); }
  #overlay.show { display: flex; animation: popin 0.35s ease; }
  @keyframes popin { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #overlayTime {
    font-size: calc(clamp(22px, 9vh, 68px) * var(--ov-scale));
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.85);
  }
  #overlayMsg {
    font-size: calc(clamp(30px, 11vh, 108px) * var(--ov-scale));
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    max-width: 94%;
    word-break: keep-all;
  }
  .overlay-actions { display: flex; gap: 14px; -webkit-app-region: no-drag; }
  .overlay-actions button {
    -webkit-app-region: no-drag;
    border: none;
    border-radius: 12px;
    padding: 12px 26px;
    font-size: clamp(13px, 3vh, 22px);
    font-weight: 700;
    cursor: pointer;
  }
  #dismissBtn { background: #ffffff; color: #0d5c3d; }
  #snoozeBtn { background: rgba(255,255,255,0.25); color: #ffffff; }
  .overlay-actions button:active { transform: translateY(2px); }

  @media (max-height: 260px) {
    .activity-editor { display: none; }
    .controls button, .presets button { min-height: 34px; padding: 5px 10px; }
    body[data-timer-running="true"] .focus-controls { display: flex; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body data-ui-theme="sunny" data-timer-running="false">
<div id="app">
  <div class="corner-hint tl"></div>
  <div class="corner-hint tr"></div>
  <div class="corner-hint bl"></div>
  <div class="corner-hint br"></div>
  <div class="titlebar">
    <button class="icon-btn" id="dragHandle" title="누른 채로 끌면 창을 옮길 수 있어요 (Alt+드래그는 어디서나 가능)" aria-label="창 이동">⠿</button>
    <div class="titlebar-actions">
      <button class="icon-btn" id="alarmBtn" title="알람 목록" aria-label="알람 목록">⏰</button>
      <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정">⚙</button>
      <button class="icon-btn" id="minimizeBtn" title="최소화" aria-label="최소화">—</button>
      <button class="icon-btn" id="maximizeBtn" title="최대화" aria-label="최대화">□</button>
      <button class="icon-btn" id="closeBtn" title="닫기" aria-label="닫기">✕</button>
    </div>
  </div>

  <!-- 시계 뷰 (기본) -->
  <div class="view active" id="clockView">
    <div id="clockTime">00:00</div>
    <div id="clockDate">—</div>
    <div id="clockNextAlarm"></div>
  </div>

  <!-- 타이머 뷰 -->
  <div class="view" id="timerView">
    <div class="activity-editor setup-only">
      <label for="activityInput">활동</label>
      <input id="activityInput" type="text" maxlength="30" value="집중 시간" placeholder="예: 수학 문제 풀기" />
    </div>
    <div id="activityLabel" class="activity-label">집중 시간</div>
    <div id="timeText" role="timer" aria-label="남은 시간 5분">05:00</div>
    <div class="progress-wrap" id="progressWrap" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300"><div id="progressBar"></div></div>
    <div id="timerStatus" class="timer-status" aria-live="polite">준비되면 시작해요</div>
    <div class="presets setup-only" aria-label="시간 빠른 선택">
      <button data-sec="60">1분</button>
      <button data-sec="180">3분</button>
      <button data-sec="300">5분</button>
      <button data-sec="600">10분</button>
      <button data-sec="900">15분</button>
      <button data-sec="1200">20분</button>
    </div>
    <div class="controls setup-only">
      <button id="modeBtn">스톱워치로</button>
      <button id="minusOne" aria-label="1분 줄이기">−1분</button>
      <button id="plusOne" aria-label="1분 늘리기">+1분</button>
      <button id="plusFive" aria-label="5분 늘리기">+5분</button>
      <button id="resetBtn">처음으로</button>
      <button id="startBtn" class="primary">시작</button>
    </div>
    <div class="controls focus-controls focus-only">
      <button id="focusStartBtn" class="primary">일시정지</button>
      <button id="focusPlusOne" aria-label="1분 추가">+1분</button>
      <button id="focusExitBtn">시간 바꾸기</button>
    </div>
  </div>

  <!-- 하단 네비 -->
  <div class="bottomnav">
    <button id="navClock" class="active">시계</button>
    <button id="navTimer">타이머</button>
  </div>

  <!-- 알람 발동 오버레이 -->
  <div id="overlay">
    <div id="overlayTime">00:00</div>
    <div id="overlayMsg">시간 종료!</div>
    <div class="overlay-actions">
      <button id="fullscreenBtn" style="background:rgba(255,255,255,0.18); color:#fff;">전체화면</button>
      <button id="snoozeBtn">5분 미루기</button>
      <button id="dismissBtn">끄기</button>
    </div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
